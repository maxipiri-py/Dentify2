# Configuracion de tests: H2 en memoria (modo MySQL), no requiere MySQL corriendo.
# Este archivo reemplaza a src/main/resources/application.properties durante los tests.
spring.application.name=login

spring.datasource.url=jdbc:h2:mem:login;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
