# Configuracion de tests: H2 en memoria (modo MySQL), no requiere MySQL corriendo.
# Este archivo reemplaza a src/main/resources/application.properties durante los tests.
spring.application.name=reporte

spring.datasource.url=jdbc:h2:mem:reporte;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# En main Flyway esta desactivado, pero en tests se ejecutan las migraciones
# y Hibernate valida que el esquema resultante calce con las entidades.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
